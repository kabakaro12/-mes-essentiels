<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administration — Mes Essentiels</title><link rel="stylesheet" href="styles.css"><style>.admin-wrap{max-width:1180px;margin:auto;padding:40px 20px}.admin-grid{display:grid;grid-template-columns:360px 1fr;gap:24px}.panel{background:#fff;border:1px solid #e5dccd;border-radius:12px;padding:20px;box-shadow:0 8px 25px #0000000a}.admin-form{display:grid;gap:10px}.admin-form input,.admin-form select,.admin-form textarea,.status-select{padding:11px;border:1px solid #d9cfbf;border-radius:7px}.admin-table{width:100%;border-collapse:collapse;font-size:13px}.admin-table th,.admin-table td{padding:10px;border-bottom:1px solid #eee;text-align:left}.admin-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.tabs{display:flex;gap:8px;margin-bottom:18px}.tabs button{padding:9px 14px;border-radius:99px;border:1px solid #ddd;background:white;cursor:pointer}.tabs button.active{background:#111;color:#efc85d}.hidden{display:none!important}@media(max-width:800px){.admin-grid{grid-template-columns:1fr}.admin-table{display:block;overflow:auto}}</style></head><body style="background:#f8f3ea"><header class="header"><a class="brand" href="index.html"><span class="monogram">ME</span><span><b>MES ESSENTIELS</b><small>Administration</small></span></a></header><main class="admin-wrap"><div id="loginPanel" class="panel" style="max-width:460px;margin:50px auto"><h2>Connexion administrateur</h2><form id="adminLogin" class="admin-form"><input id="aEmail" type="email" value="admin@mesessentiels.com" required><input id="aPassword" type="password" placeholder="Mot de passe" required><button class="btn gold">Se connecter</button><small>Pour la démo locale, le mot de passe initial est indiqué dans README.txt.</small></form><p id="loginMsg"></p></div><section id="dashboard" class="hidden"><div class="admin-top"><div><p class="eyebrow dark">BACK-OFFICE</p><h1>Gestion de la boutique</h1></div><button id="logoutAdmin" class="btn gold">Déconnexion</button></div><div class="tabs"><button class="active" data-tab="productsTab">Produits</button><button data-tab="ordersTab">Commandes</button></div><div id="productsTab" class="tab"><div class="admin-grid"><div class="panel"><h2>Ajouter un produit</h2><form id="productForm" class="admin-form"><input name="name" placeholder="Nom du produit" required><input name="price" type="number" step="1000" placeholder="Prix (FG)" required><select name="category"><option>femme</option><option>homme</option><option>enfant</option><option>accessoires</option></select><input name="sizes" placeholder="Tailles: S,M,L,XL" value="S,M,L,XL"><input name="stock" type="number" min="0" placeholder="Stock" value="5"><input name="image" placeholder="Image" value="assets/prod1.jpg"><textarea name="description" placeholder="Description"></textarea><button class="btn gold">Ajouter</button></form></div><div class="panel"><h2>Produits</h2><div id="productsAdmin"></div></div></div></div><div id="ordersTab" class="tab hidden"><div class="panel"><h2>Commandes</h2><div id="ordersAdmin"></div></div></div></section></main><script src="admin.js"></script></body></html>
